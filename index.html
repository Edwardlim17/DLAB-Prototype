<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ocean & Co. | Seafood Ordering (Demo)</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b2a43;--navy2:#143d5e;--teal:#1b8a8a;--tealbg:#e3f2f0;--cream:#faf6ee;--card:#fff;--coral:#d9552b;--coral2:#b8431d;--ink:#17283a;--mute:#5a6b7a;--line:#e3ddd0;--ok:#16794c;--err:#b3261e;--r:18px;--sh:0 6px 22px rgba(11,42,67,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.55 'Instrument Sans',system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;color:var(--navy);line-height:1.15;margin:0}
h1{font-size:clamp(2.2rem,6vw,3.7rem)}h2{font-size:clamp(1.6rem,3.5vw,2.2rem)}h3{font-size:1.15rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
.btn{border:0;border-radius:999px;padding:.7em 1.4em;font-weight:600;cursor:pointer;background:var(--coral);color:#fff;transition:background .2s,transform .1s}
.btn:hover{background:var(--coral2)}.btn:active{transform:scale(.98)}
.btn.alt{background:transparent;color:var(--navy);border:2px solid var(--navy)}.btn.alt:hover{background:var(--navy);color:#fff}
.btn.sm{padding:.45em 1em;font-size:.9rem}.btn:disabled{opacity:.45;cursor:not-allowed}
header{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff}
.hd{display:flex;align-items:center;gap:16px;height:64px}
.logo{font-family:Fraunces,serif;font-weight:700;font-size:1.35rem;display:flex;gap:8px;align-items:center;background:none;border:0;color:#fff;cursor:pointer}
nav{display:flex;gap:22px;margin-left:auto}nav a{color:#d6e6ef;text-decoration:none;font-weight:500;cursor:pointer}nav a:hover{color:#fff}
.cnt{background:#ffffff1f;border-radius:999px;padding:.4em .9em;font-weight:600;border:0;color:#fff;cursor:pointer;white-space:nowrap}
.burger{display:none;background:none;border:0;color:#fff;font-size:1.6rem;cursor:pointer}
@media(max-width:820px){.burger{display:block;margin-left:auto}nav{display:none;position:absolute;top:64px;left:0;right:0;background:var(--navy);flex-direction:column;padding:14px 18px;gap:14px}nav.open{display:flex}.hd .go{display:none}}
.steps{display:flex;gap:8px;padding:14px 0;font-size:.9rem;overflow-x:auto}
.steps li{list-style:none;flex:1;min-width:110px;padding:8px 12px;border-radius:12px;background:#ece6d8;color:var(--mute);font-weight:500}
.steps li.on{background:var(--navy);color:#fff}.steps li.done{background:var(--tealbg);color:var(--teal)}
.steps{margin:0;padding-left:0}
.hero{background:var(--navy);color:#fff;border-radius:0 0 40px 40px;overflow:hidden}
.hero .wrap{display:grid;gap:30px;padding-top:44px;padding-bottom:54px;align-items:center}
@media(min-width:900px){.hero .wrap{grid-template-columns:1.1fr .9fr}}
.hero h1{color:#fff}.hero p{color:#c9dbe7;font-size:1.1rem;max-width:34em}
.trust{display:grid;gap:10px;margin-top:26px;padding:0;list-style:none}
@media(min-width:620px){.trust{grid-template-columns:repeat(3,1fr)}}
.trust li{background:#ffffff14;border-radius:14px;padding:12px 14px;font-size:.95rem}.trust b{display:block;color:#7fd6cf}
.heroart{border-radius:28px;background:linear-gradient(160deg,#1b8a8a,#0e4f6e);aspect-ratio:5/4;display:grid;place-items:center;font-size:clamp(4rem,12vw,7rem);position:relative}
.heroart{overflow:hidden}.heroart img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.heroart span{position:absolute;filter:drop-shadow(0 8px 10px #0004)}
section{padding:46px 0}.sub{color:var(--mute);max-width:40em}
.how{display:grid;gap:16px;margin-top:20px}@media(min-width:760px){.how{grid-template-columns:repeat(3,1fr)}}
.how div{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:var(--sh)}
.layout{display:grid;gap:26px}@media(min-width:1000px){.layout{grid-template-columns:1fr 370px;align-items:start}}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
.tools input,.tools select{padding:.65em 1em;border:1.5px solid var(--line);border-radius:999px;background:#fff}.tools input{flex:1;min-width:200px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:.4em 1em;cursor:pointer;font-weight:500}
.chip[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:#fff}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));margin-top:6px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;position:relative}
.ph{position:relative;overflow:hidden;aspect-ratio:16/10;display:grid;place-items:center;font-size:4rem;background-size:cover;background-position:center}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:10px;left:10px;background:#fffffff0;border-radius:999px;padding:.15em .7em;font-size:.8rem;font-weight:600;color:var(--navy)}
.badge.in{left:auto;right:10px;background:var(--teal);color:#fff;display:none}.card.has .badge.in{display:block}
.cb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}.cb p{margin:0;color:var(--mute);font-size:.92rem}
.price{font-weight:600;color:var(--navy)}.price small{color:var(--mute);font-weight:400}
.q{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:999px;background:#fff}
.q button{width:34px;height:34px;border:0;background:none;font-size:1.2rem;cursor:pointer;border-radius:50%}.q button:hover{background:var(--tealbg)}
.q span{min-width:64px;text-align:center;font-weight:600;font-size:.92rem}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:auto}
select.opt{width:100%;padding:.5em .8em;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.note{font-size:.85rem;color:var(--mute)}.warn{background:#fff1e8;border:1px solid #f1c7ae;border-radius:12px;padding:10px 12px;font-size:.9rem;color:#7a3414}
.empty{text-align:center;padding:30px 12px;color:var(--mute)}
.bund{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));margin-top:18px}
.bund .card{border-top:5px solid var(--coral)}.bund ul{margin:0;padding-left:1.1em;font-size:.92rem;color:var(--mute)}
aside#sumbox{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px;position:sticky;top:80px;max-height:calc(100vh - 100px);overflow:auto}
aside h3{margin-bottom:8px}
.lines{list-style:none;margin:0;padding:0}
.line{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.line .lt small{display:block;color:var(--mute);font-size:.85rem}.line .lp{font-weight:600;text-align:right}
.line .lc{grid-column:1/-1;display:flex;gap:8px;align-items:center}
.rm{border:0;background:none;color:var(--err);cursor:pointer;font-size:.85rem;text-decoration:underline}
.tot{display:flex;justify-content:space-between;padding:4px 0}.tot.big{font-family:Fraunces,serif;font-size:1.7rem;color:var(--navy);border-top:2px solid var(--navy);margin-top:8px;padding-top:10px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.kpis div{background:var(--tealbg);border-radius:12px;padding:8px 10px;font-size:.85rem;color:var(--mute)}.kpis b{display:block;font-size:1.15rem;color:var(--navy)}
.bar{display:none}
@media(max-width:999px){
aside#sumbox{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:80vh;border-radius:22px 22px 0 0;z-index:40;transform:translateY(110%);transition:transform .25s;box-shadow:0 -10px 40px #0005}
aside#sumbox.open{transform:none}
.bar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--navy);color:#fff;padding:10px 18px;justify-content:space-between;align-items:center}
body.noshop .bar{display:none}}
.page{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:22px;margin:10px 0 40px}
form{display:grid;gap:14px}.fg{display:grid;gap:14px}@media(min-width:700px){.fg{grid-template-columns:1fr 1fr}}
label{font-weight:500;display:grid;gap:4px;font-size:.95rem}label small{font-weight:400;color:var(--mute)}
input,select,textarea{padding:.65em .8em;border:1.5px solid #c9c2b2;border-radius:10px;background:#fff}
.bad input,.bad select,.bad textarea{border-color:var(--err)}.msg{color:var(--err);font-size:.85rem;min-height:0}
.radios{display:flex;gap:16px;flex-wrap:wrap;font-weight:400}.radios label{display:flex;grid:none;gap:6px;align-items:center;font-weight:400}.radios input{padding:0}
.two{display:grid;gap:26px}@media(min-width:960px){.two{grid-template-columns:1fr 380px;align-items:start}}
.ref{font-family:Fraunces,serif;font-size:2rem;color:var(--teal)}
.demo{background:#fff8e1;border:1px solid #ecd48a;border-radius:12px;padding:12px 14px;font-size:.92rem}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
footer{background:var(--navy);color:#c9dbe7;padding:34px 0 90px}footer a{color:#7fd6cf}
#toast{position:fixed;top:76px;right:16px;z-index:60;display:grid;gap:8px}
.t{background:var(--navy);color:#fff;padding:.7em 1.1em;border-radius:12px;box-shadow:var(--sh);animation:in .2s}
@keyframes in{from{opacity:0;transform:translateY(-6px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hidden{display:none!important}
@media print{header,footer,.steps,.noprint,.bar,#toast,#sumbox,.demo{display:none!important}body{background:#fff}.page{box-shadow:none;padding:0}}
</style>
</head>
<body>
<header><div class="wrap hd">
<button class="logo" id="logo" aria-label="Home"><span aria-hidden="true">🌊</span><span id="coName"></span></button>
<button class="burger" id="burger" aria-label="Menu" aria-expanded="false">☰</button>
<nav id="nav" aria-label="Main">
<a data-go="catalogue" tabindex="0" role="link">Our Seafood</a><a data-go="how" tabindex="0" role="link">How It Works</a><a data-go="pricing" tabindex="0" role="link">Pricing</a><a data-go="contact" tabindex="0" role="link">Contact</a></nav>
<button class="cnt" id="hdCnt" aria-label="Open order summary">🧺 0 items</button>
<button class="btn go sm" id="hdBuild">Build Your Order</button>
</div></header>

<div class="wrap"><ol class="steps" id="steps" aria-label="Progress"></ol></div>
<main id="app"></main>

<footer id="contact"><div class="wrap">
<h3 style="color:#fff" id="fCo"></h3><p id="fInfo"></p>
<p class="note" style="color:#9db6c7">Demo prototype. Sample products and prices are illustrative only and do not reflect live stock or market prices.</p>
</div></footer>
<div class="bar" id="bar"><span id="barTxt"></span><button class="btn sm" id="barBtn">View order</button></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   1. EDIT HERE: company details, delivery & discount rules
   ===================================================================== */
const CONFIG = {
  company: "Ocean & Co.",                 // company name (shown in header, footer, summaries)
  email: "hello@oceanandco.example",
  phone: "+65 6000 0000",
  whatsapp: "+65 9000 0000",
  address: "1 Harbour Lane, Singapore",
  symbol: "S$",                           // currency symbol
  currencyCode: "SGD",
  delivery: { fee: 15, freeOver: 150 },   // flat fee; free when subtotal (after discount) >= freeOver. Set fee:0 to disable.
  minOrder: 60,                           // minimum fixed-price subtotal before details can be entered. 0 = none
  discounts: [                            // empty array [] = no discounts. Applied only when rule is met.
    { label: "Volume saving (5%)", minSubtotal: 300, percent: 5 }
  ],
  imageFolder: "images",                  // photos are auto-loaded from images/<product id>.jpg (e.g. images/salmon.jpg), next to index.html
  imageExt: "jpg",
  submitUrl: ""                           // paste a form-service/backend URL here to POST enquiries (see notes). Empty = demo mode.
};

/* =====================================================================
   2. EDIT HERE: product catalogue
   id: unique | cat: category | unit: "kg" | "piece" | "pack"
   price: sample price per unit (illustrative) | mode: "fixed" or "quote" (quote = price confirmed by company)
   status: "Fresh" | "Frozen" | "Live" | min / step: minimum and step quantity
   opts: size choices; adj = extra price per unit | img: optional photo URL/file; if omitted, images/<id>.jpg is tried; if missing, the emoji tile shows
   ===================================================================== */
const CATEGORIES = ["Fish","Crabs","Prawns & Shrimp","Lobster","Shellfish","Squid & Cuttlefish","Specialty"];
const PRODUCTS = [
 {id:"salmon",cat:"Fish",name:"Salmon Fillet",desc:"Skin-on Norwegian-style fillet, rich and buttery.",emoji:"🐟",unit:"kg",price:42,mode:"fixed",status:"Fresh",min:0.5,step:0.5,opts:[{l:"Whole side (approx.)"},{l:"Portioned 150–200 g",adj:3}],prep:true},
 {id:"seabass",cat:"Fish",name:"Sea Bass",desc:"Whole farmed sea bass, firm white flesh.",emoji:"🐟",unit:"kg",price:24,mode:"fixed",status:"Fresh",min:1,step:0.5,opts:[{l:"500–700 g each"},{l:"800 g–1 kg each",adj:4}],prep:true},
 {id:"hiramasa",cat:"Fish",name:"Hiramasa (Yellowtail Kingfish)",desc:"Japanese-style kingfish with a clean, buttery bite. Great raw or grilled.",emoji:"🐠",unit:"kg",price:52,mode:"fixed",status:"Fresh",min:1,step:0.5,opts:[{l:"Whole, gutted"},{l:"Sashimi block",adj:12}],prep:true},
 {id:"snapper",cat:"Fish",name:"Red Snapper",desc:"Sweet, delicate fish ideal for grilling or frying.",emoji:"🐡",unit:"kg",price:19,mode:"fixed",status:"Fresh",min:1,step:0.5,opts:[{l:"400–600 g each"},{l:"700 g+ each",adj:3}],prep:true},
 {id:"mudcrab",cat:"Crabs",name:"Mud Crab",desc:"Meaty mud crab, perfect for chilli or pepper crab.",emoji:"🦀",unit:"kg",price:58,mode:"fixed",status:"Live",min:1,step:0.5,opts:[{l:"500–600 g each"},{l:"700–800 g each",adj:6},{l:"900 g+ each",adj:12}],prep:true},
 {id:"flowercrab",cat:"Crabs",name:"Flower Crab",desc:"Sweet roe-rich crab. Price varies by catch.",emoji:"🦀",unit:"kg",price:0,mode:"quote",status:"Fresh",min:1,step:0.5,opts:[{l:"200–300 g each"},{l:"300 g+ each"}],prep:true},
 {id:"crabmeat",cat:"Crabs",name:"Crab Meat",desc:"Hand-picked white crab meat, ready for salads, pasta and crab cakes.",emoji:"🦀",unit:"pack",price:38,mode:"fixed",status:"Fresh",min:1,step:1,opts:[{l:"Lump meat, 250 g"},{l:"Jumbo lump, 250 g",adj:12}],prep:false},
 {id:"whiteprawn",cat:"Prawns & Shrimp",name:"Fresh White Prawns",desc:"Head-on white prawns, sweet and juicy. Best steamed or grilled.",emoji:"🦐",unit:"kg",price:34,mode:"fixed",status:"Fresh",min:0.5,step:0.5,opts:[{l:"Medium (30–40 per kg)"},{l:"Large (20–30 per kg)",adj:6}],prep:true},
 {id:"whiteshrimp",cat:"Prawns & Shrimp",name:"White Shrimp",desc:"Everyday sweet shrimp, easy to cook.",emoji:"🦐",unit:"kg",price:22,mode:"fixed",status:"Frozen",min:1,step:0.5,opts:[{l:"Shell-on"},{l:"Peeled & deveined",adj:5}],prep:false},
 {id:"rocklobster",cat:"Lobster",name:"Frozen Lobster Tail",desc:"Cleaned tails ready for baking or butter-poaching.",emoji:"🦞",unit:"piece",price:26,mode:"fixed",status:"Frozen",min:2,step:1,opts:[{l:"150–200 g"},{l:"250 g+",adj:9}],prep:false},
 {id:"scallops",cat:"Shellfish",name:"Hokkaido Scallops",desc:"Sashimi-grade, roe-off. Pack of 10.",emoji:"🐚",unit:"pack",price:32,mode:"fixed",status:"Frozen",min:1,step:1,opts:[{l:"Size M (10 pcs)"},{l:"Size L (10 pcs)",adj:10}],prep:false},
 {id:"oysters",cat:"Shellfish",name:"Hyogo Oysters",desc:"Plump, creamy oysters from Hyogo, Japan. Enjoy raw or grilled.",emoji:"🦪",unit:"pack",price:36,mode:"fixed",status:"Fresh",min:1,step:1,opts:[{l:"Pack of 6"},{l:"Pack of 12",adj:34}],prep:false},
 {id:"clams",cat:"Shellfish",name:"Live Clams",desc:"Fresh clams for broths and stir-fries.",emoji:"🦪",unit:"kg",price:11,mode:"fixed",status:"Live",min:1,step:0.5,opts:[],prep:false},
 {id:"squid",cat:"Squid & Cuttlefish",name:"Whole Squid",desc:"Tender squid, cleaned on request.",emoji:"🦑",unit:"kg",price:18,mode:"fixed",status:"Fresh",min:1,step:0.5,opts:[{l:"Medium"},{l:"Large",adj:3}],prep:true},
 {id:"babysquid",cat:"Squid & Cuttlefish",name:"Baby Squid",desc:"Small, tender squid for quick frying, grilling or hotpot.",emoji:"🦑",unit:"kg",price:16,mode:"fixed",status:"Fresh",min:1,step:0.5,opts:[],prep:true},
 {id:"seacucumber",cat:"Specialty",name:"Sea Cucumber",desc:"Premium prepared sea cucumber for braising and festive dishes. Market priced.",emoji:"🥒",unit:"kg",price:0,mode:"quote",status:"Fresh",min:0.5,step:0.5,opts:[{l:"Medium"},{l:"Large"}],prep:false}
];
/* Bundles: fixed indicative price, contents are shown as one itemised line (no double counting) */
const BUNDLES = [
 {id:"family",name:"Family Seafood Feast",serves:"Serves 4–5",price:128,emoji:"🍽️",items:["1 kg Sea Bass","1 kg Fresh White Prawns","1 kg Mud Crab","1 kg Live Clams"]},
 {id:"bbq",name:"Premium BBQ Seafood Set",serves:"Serves 6–8",price:168,emoji:"🔥",items:["1 kg Fresh White Prawns","4 Frozen Lobster Tails (150–200 g)","1 kg Whole Squid","2 packs Hokkaido Scallops"]},
 {id:"hotpot",name:"Hotpot Seafood Selection",serves:"Serves 3–4",price:78,emoji:"🍲",items:["1 kg White Shrimp","1 kg Live Clams","1 kg Baby Squid","1 pack Hyogo Oysters (6)"]},
 {id:"resto",name:"Restaurant Starter Pack",serves:"Menu trial, 10+ covers",price:320,emoji:"👨‍🍳",items:["3 kg Salmon Fillet","3 kg Sea Bass","2 kg Fresh White Prawns","2 kg Whole Squid"]}
];
const PREP = ["Whole","Cleaned","Filleted","Cut into pieces","Other"];

/* =====================================================================
   3. App logic (no need to edit below for normal business changes)
   ===================================================================== */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => CONFIG.symbol + Number(n).toLocaleString("en-SG",{minimumFractionDigits:2,maximumFractionDigits:2});
const r2 = n => Math.round(n*100)/100;
const prod = id => PRODUCTS.find(p => p.id === id);
const unitTxt = (u,q) => u==="kg" ? q+" kg" : u==="piece" ? q+(q===1?" piece":" pieces") : q+(q===1?" pack":" packs");

let view = "shop", cart = [], enquiry = null, filters = {cat:"All",q:"",sort:"featured"}, cardState = {}, formData = {};

/* ---- pricing ---- */
function unitPrice(l){ const p = prod(l.id), o = p.opts[l.opt]; return p.price + (o && o.adj || 0); }
function lineTotal(l){ if(l.kind==="b") return r2(BUNDLES.find(b=>b.id===l.id).price * l.qty); const p = prod(l.id); return p.mode==="quote" ? null : r2(unitPrice(l)*l.qty); }
function calc(){
  let subtotal = 0, quote = false, qtyKg = 0, products = 0;
  cart.forEach(l => { const t = lineTotal(l); if(t===null) quote = true; else subtotal += t; products++; if(l.kind!=="b" && prod(l.id).unit==="kg") qtyKg += l.qty; });
  subtotal = r2(subtotal);
  let disc = {label:"",amount:0};
  CONFIG.discounts.forEach(d => { const a = r2(subtotal*d.percent/100); if(subtotal>=d.minSubtotal && a>disc.amount) disc = {label:d.label,amount:a}; });
  const after = r2(subtotal - disc.amount);
  const delivery = cart.length===0 ? 0 : (after >= CONFIG.delivery.freeOver ? 0 : CONFIG.delivery.fee);
  const total = r2(after + delivery);
  const belowMin = !quote && cart.length>0 && subtotal < CONFIG.minOrder;
  return {subtotal,quote,qtyKg,products,disc,delivery,total,belowMin,count:cart.length};
}

/* ---- cart actions ---- */
function addProduct(id){
  const p = prod(id), st = cardState[id]; const key = "p:"+id+":"+st.opt;
  const ex = cart.find(l => l.key===key);
  if(ex) ex.qty = r2(ex.qty + st.qty); else cart.push({key,kind:"p",id,opt:st.opt,qty:st.qty});
  toast("Added "+unitTxt(p.unit,st.qty)+" "+p.name); sync();
}
function addBundle(id){
  const key = "b:"+id, ex = cart.find(l=>l.key===key);
  if(ex) ex.qty++; else cart.push({key,kind:"b",id,qty:1});
  toast("Added "+BUNDLES.find(b=>b.id===id).name); sync();
}
function changeQty(key,dir){
  const l = cart.find(x=>x.key===key); if(!l) return;
  const p = l.kind==="b" ? {min:1,step:1} : prod(l.id), nq = r2(l.qty + dir*p.step);
  if(nq < p.min){ toast("Minimum order is "+(l.kind==="b"?"1 bundle":unitTxt(prod(l.id).unit,p.min))+". Use Remove to delete this item."); return; }
  l.qty = nq; sync();
}
function removeLine(key){ cart = cart.filter(l=>l.key!==key); sync(); }
function resetOrder(){ if(cart.length && confirm("Remove all items from your order?")){ cart = []; sync(); toast("Order cleared"); if(view!=="shop") setView("shop"); } }

/* ---- rendering: catalogue ---- */
function visibleProducts(){
  let list = PRODUCTS.filter(p => (filters.cat==="All"||p.cat===filters.cat) && (p.name+" "+p.desc+" "+p.cat).toLowerCase().includes(filters.q.toLowerCase()));
  if(filters.sort==="name") list.sort((a,b)=>a.name.localeCompare(b.name));

}

/* ---- validation, summary, submission ---- */
function validate(d){
  const e = {};
  if(!d.name.trim()) e.name = "Enter your full name.";
  if(!d.email.trim()) e.email = "Enter your email address."; else if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(d.email.trim())) e.email = "Enter a valid email, like name@example.com.";
  const digits = d.phone.replace(/\D/g,""); if(!d.phone.trim()) e.phone = "Enter a contact number."; else if(digits.length<8||digits.length>15||/[^\d\s+()-]/.test(d.phone)) e.phone = "Enter a valid phone number (8–15 digits).";
  if(d.postal.trim() && !/^\d{6}$/.test(d.postal.trim())) e.postal = "Singapore postal codes have 6 digits.";
  if(d.date && new Date(d.date) < new Date(new Date().toDateString())) e.date = "Choose today or a future date.";
  if(!d.consent) e.consent = "Please tick the box so we can reply to your enquiry.";
  return e;
}
function buildEnquiry(ref,d){
  const c = calc();
  return {reference:ref,demo:true,createdAt:new Date().toISOString(),currency:CONFIG.currencyCode,
    customer:{name:d.name.trim(),company:d.company.trim(),email:d.email.trim(),phone:d.phone.trim(),type:d.ctype,preferredContact:d.contact,orderType:d.otype,preferredPreparation:d.prep,deliveryDate:d.date,address:d.address.trim(),postalCode:d.postal.trim(),notes:d.notes.trim(),consentToContact:true},
    items:cart.map(l=>{const b=l.kind==="b"?BUNDLES.find(x=>x.id===l.id):null,p=b?null:prod(l.id),t=lineTotal(l);
      return b?{type:"bundle",name:b.name,quantity:l.qty,contents:b.items,lineTotal:t}:{type:"product",name:p.name,option:(p.opts[l.opt]||{}).l||"",status:p.status,unit:p.unit,quantity:l.qty,unitPrice:p.mode==="quote"?null:unitPrice(l),priceMode:p.mode,lineTotal:t};}),
    pricing:{subtotal:c.subtotal,discount:c.disc.amount,discountLabel:c.disc.label,delivery:c.delivery,estimatedTotal:c.total,containsQuotationItems:c.quote},
    disclaimer:"Estimate only. Sample prices are illustrative. Not a confirmed quotation, order or stock reservation."};
}
function enquiryText(q){
  const L = [`${CONFIG.company} – Seafood enquiry ${q.reference}`,"(DEMO: not transmitted to the company)","",`Name: ${q.customer.name}`+(q.customer.company?` (${q.customer.company})`:""),`Email: ${q.customer.email} | Phone: ${q.customer.phone} | Prefers: ${q.customer.preferredContact}`,`Type: ${q.customer.type} | ${q.customer.orderType}`,`Delivery: ${q.customer.deliveryDate||"flexible"}, ${q.customer.address||"address not given"} ${q.customer.postalCode}`,`Preparation: ${q.customer.preferredPreparation}`,q.customer.notes?`Notes: ${q.customer.notes}`:"","","Items:"];
  q.items.forEach(i=>L.push(i.type==="bundle"?`- ${i.name} x${i.quantity} (${i.contents.join("; ")}): ${fmt(i.lineTotal)}`:`- ${i.name}${i.option?" ["+i.option+"]":""}, ${unitTxt(i.unit,i.quantity)}: ${i.lineTotal===null?"Quotation required":fmt(i.lineTotal)}`));
  const p = q.pricing; L.push("",`Subtotal: ${fmt(p.subtotal)}`); if(p.discount) L.push(`${p.discountLabel}: -${fmt(p.discount)}`);
  L.push(`Delivery (estimate): ${p.delivery?fmt(p.delivery):"Free"}`,`Estimated total: ${fmt(p.estimatedTotal)}${p.containsQuotationItems?" (excludes quotation items)":""}`,"",q.disclaimer);
  return L.filter(x=>x!==undefined).join("\n");
}
/* Backend hook: set CONFIG.submitUrl to a form service/API that accepts JSON. Without it, nothing is sent anywhere. */
async function submitEnquiry(q){
  if(!CONFIG.submitUrl) return {sent:false};
  const res = await fetch(CONFIG.submitUrl,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(q)});
  if(!res.ok) throw new Error("Server responded "+res.status);
  return {sent:true};
}
async function handleSubmit(ev){
  ev.preventDefault(); saveForm(); const d = formData, e = validate(d);
  $$("#form label").forEach(l=>l.classList.remove("bad")); $$("#form .msg").forEach(m=>m.textContent="");

    keys.forEach(k=>{ if(k==="consent") $("#consentMsg").textContent=e[k]; else { const i=$(`[name=${k}]`); i.closest("label").classList.add("bad"); i.parentElement.querySelector(".msg").textContent=e[k]; }});
    const first = $(`[name=${keys[0]}]`); first.focus(); toast("Please fix the highlighted fields. Your order is safe."); return;
  }
  const ref = "OC-"+new Date().toISOString().slice(2,10).replace(/-/g,"")+"-"+Math.random().toString(36).slice(2,6).toUpperCase();
  const q = buildEnquiry(ref,d), btn = $("#form button[type=submit]"); btn.disabled = true; btn.textContent = "Preparing…";

}

/* ---- misc ---- */
function toast(m){ const t = document.createElement("div"); t.className="t"; t.textContent=m; $("#toast").appendChild(t); setTimeout(()=>t.remove(),2800); }
function goSection(id){ if(view!=="shop") setView("shop",id); else document.getElementById(id)?.scrollIntoView(); $("#nav").classList.remove("open"); }

document.addEventListener("click", ev => {

  const b = ev.target.closest("[data-act]"); if(!b) return; const a = b.dataset.act, id = b.dataset.id;
  switch(a){
    case "cat": filters.cat = b.dataset.c; $$("#chips .chip").forEach(c=>c.setAttribute("aria-pressed",c.dataset.c===filters.cat)); renderCatalogue(); break;
    case "clear": filters = {cat:"All",q:"",sort:"featured"}; renderShop(); break;
    case "cq": { const p = prod(id), st = cardState[id], nq = r2(st.qty + b.dataset.d*p.step); if(nq < p.min){ toast("Minimum order is "+unitTxt(p.unit,p.min)+"."); break; } st.qty = nq; $("#q-"+id).textContent = unitTxt(p.unit,nq); break; }
    case "add": addProduct(id); break;
    case "quick": cardState[id] ||= {opt:0,qty:prod(id).min}; addProduct(id); renderReco(); break;
    case "bundle": addBundle(id); break;
    case "lq": changeQty(b.dataset.k, +b.dataset.d); break;
    case "rm": removeLine(b.dataset.k); break;
    case "reset": resetOrder(); break;
    case "start": document.getElementById("catalogue").scrollIntoView(); break;
    case "review": setView("review"); break;
    case "back": setView("shop"); break;
    case "details": setView("details"); break;
    case "toReview": setView("review"); break;
    case "copy": navigator.clipboard?.writeText(enquiryText(enquiry)).then(()=>toast("Summary copied"),()=>toast("Copy blocked by your browser. Use Print instead.")); break;
    case "json": { const u = URL.createObjectURL(new Blob([JSON.stringify(enquiry,null,2)],{type:"application/json"})), l = document.createElement("a"); l.href=u; l.download=enquiry.reference+".json"; l.click(); URL.revokeObjectURL(u); break; }
    case "print": window.print(); break;
    case "new": cart=[]; enquiry=null; formData={}; cardState={}; setView("shop"); sync(); break;
  }
});
document.addEventListener("change", ev => { const t = ev.target;
  if(t.dataset.act==="opt") cardState[t.dataset.id].opt = +t.value;
  if(t.id==="sort"){ filters.sort = t.value; renderCatalogue(); }
});
document.addEventListener("input", ev => { if(ev.target.id==="search"){ filters.q = ev.target.value; renderCatalogue(); } });
document.addEventListener("keydown", ev => { if(ev.key==="Enter" && ev.target.matches("nav a")) goSection(ev.target.dataset.go); });
$("#logo").onclick = () => setView("shop");
$("#hdBuild").onclick = () => { if(view!=="shop") setView("shop","catalogue"); else document.getElementById("catalogue").scrollIntoView(); };
$("#burger").onclick = e => { const o = $("#nav").classList.toggle("open"); e.currentTarget.setAttribute("aria-expanded",o); };
const openSum = () => { if(view==="shop") $("#sumbox").classList.toggle("open"); else setView("review"); };
$("#hdCnt").onclick = openSum; $("#barBtn").onclick = openSum;

document.title = CONFIG.company + " | Seafood Ordering (Demo)";
$("#coName").textContent = CONFIG.company; $("#fCo").textContent = CONFIG.company;
$("#fInfo").innerHTML = `${esc(CONFIG.address)}<br>Email <a href="mailto:${esc(CONFIG.email)}">${esc(CONFIG.email)}</a> · Phone ${esc(CONFIG.phone)} · WhatsApp ${esc(CONFIG.whatsapp)}`;
setView("shop");
</script>
</body>
</html>
